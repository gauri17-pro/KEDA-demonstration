apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: worker-rabbitmq
  namespace: keda-demo
spec:
  scaleTargetRef:
    name: worker
  minReplicaCount: 0
  maxReplicaCount: 20
  pollingInterval: 5
  cooldownPeriod: 30
  triggers:
    - type: rabbitmq
      metadata:
        # rabbitmq service in the same namespace
        host: amqp://demo:demo@rabbitmq:5672/
        queueName: orders
        mode: QueueLength
        value: "50" # target: 1 replica per ~50 queued messages

