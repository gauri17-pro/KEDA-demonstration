apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: keda-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      imagePullSecrets:
        - name: docker-creds
      containers:
        - name: order-service
          image: gauris17/order-service:v1
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "8002"
            - name: ORDERS_QUEUE
              value: "orders"
            - name: RABBITMQ_URL
              value: "amqp://demo:demo@rabbitmq:5672/"
          ports:
            - containerPort: 8002
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
spec:
  type: LoadBalancer
  selector:
    app: order-service
  ports:
    - port: 80
      targetPort: 8002
      

