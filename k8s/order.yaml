apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: order-service:local
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "8002"
            - name: ORDERS_QUEUE
              value: "orders"
            - name: RABBITMQ_URL
              value: "amqp://demo:demo@rabbitmq:5672/"
          ports:
            - containerPort: 8002
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
spec:
  selector:
    app: order-service
  ports:
    - port: 80
      targetPort: 8002

