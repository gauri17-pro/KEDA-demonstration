apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
  namespace: keda-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog-service
  template:
    metadata:
      labels:
        app: catalog-service
    spec:
      imagePullSecrets:
        - name: docker-creds
      containers:
        - name: catalog-service
          image: gauris17/catalog-service:v1
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "8001"
          ports:
            - containerPort: 8001
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-service
  namespace: keda-demo
spec:
  type: ClusterIP
  selector:
    app: catalog-service
  ports:
    - port: 80
      targetPort: 8001

